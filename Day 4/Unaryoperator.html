<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>
        // unary operator 

        // increment operator 
        let a=8;
        a++;
        console.log(a);
        //decrement operator 
        let b=8;
        b--;
        console.log(b--);

        // 1st.prefix 
        let c=8;
        console.log(++c);

        // 2nd.postfix 
        let d=8;
        console.log(d++);
    </script>
    
</body>
</html>
