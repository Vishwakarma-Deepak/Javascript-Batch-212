<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        // swap a value using third variable .
        let a = 4;
        let b = 5;

        let t=a;
        a=b;
        b=t;

        console.log(a);
        console.log(b);

        // swap a variable without using third variable.

        let c = 10;
        let d = 20;

        c = c+d;
        d = c-d;
        c = c-d;

        console.log(c);
        console.log(d);
        
        

        


    </script>

</body>

</html>
