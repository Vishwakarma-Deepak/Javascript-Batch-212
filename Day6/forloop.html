<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        // initialization , conditon , increment/decrement.
        for (let i = 0; i < 10; i++) {
            document.write("hello" + "<br>");
        }

        for (let i = 0; i < 10; i++) {
            // in place of + we can also use comma but + is generally use.
            document.write(i + "<br>");
        }

        for (let q = 21; q <= 30; q++) {
            document.write(q, "<br>");
        }

        // decrement example
        for (let i = 10; i >= 1; i--) {
            document.write(i, "<br>");
        }

        for (i = 1; i <= 10; i = i + 2) {
            document.write(i, "<br>");
        }




    </script>


</body>

</html>
