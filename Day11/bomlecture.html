<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        // BOM (Browser Object Model) is an object model that allows JavaScript to interact with the web browser . 
        console.log(window.document);
        document.write("window height" + window.innerHeight + "<br>");
        document.write("window width" + window.innerWidth);

        // navigator object
        // provide the info about browser .
        console.log(navigator.appName);
        console.log(navigator.userAgent);
        console.log(navigator.language);

        // location object
        // provide the info of the current webpage url.
        console.log(location.href);

        // history object - not done.

        // screen object
        console.log(screen.width);
        console.log(screen.height);

    </script>

</body>

</html>
