<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>
        // number 
        let age=21;
        console.log(age,typeof age);
        
        let n=3453.4;
        console.log(n,typeof n);

        // biginit 
        let y=354545446463n;
        console.log(y,typeof y);
        // string
        let name="alam";
        console.log(name,typeof name);

        let firstname="3536";
        console.log(firstname,typeof firstname);

        // boolean
        let t=true;
        console.log(t,typeof t);

        let f=false;
        console.log(f,typeof f);

        // undefined 
        let value;
        console.log(value);

        // object 
        let address1=null;
        console.log(address1, typeof address1);

        // symbol
        cityname=Symbol("id");
        console.log(cityname, typeof cityname);
        
        
        
    </script>
    
</body>
</html>
