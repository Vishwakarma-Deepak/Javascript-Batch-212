<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // A nested if means an if statement inside another if statement .it is used when one condition depends on another.

        let username = "admin";
        let password = "1234";

        if (username === "admin") {
            if (password === "1234") {
                console.log("Login successful");

            }
            else {
                console.log("Wrong password");

            }

        }
        else {
            console.log("invalid username");

        }


    </script>
</body>

</html>
