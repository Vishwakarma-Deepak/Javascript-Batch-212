<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // agar hum case true hone ke baad break nhi likhte toh by default uske niche ke saare statement print honge.

        let day=3;
        switch (day){
            case 1:
                document.write("Monday");
                break;

            case 2:
                document.write("Tuesday");
                break;

            case 3:
                document.write("Wednesday");
                break;

            case 4:
                document.write("Thursday");
                break;
            default:
                document.write("Invalid Day")

        }
      
    </script>

    
</body>
</html>
