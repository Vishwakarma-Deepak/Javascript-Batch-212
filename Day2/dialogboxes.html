<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        console.log("hello !");
        // we can also write h tag p tag etc. in document.write
        document.write("<h1>hello</h1>");
        // alert is to show warning in webpage like its show only one  button.
        alert("welcome to my webpage.");

        // prompt is a js method used to take input from the user through a popup dialog box.
        prompt("enter your name");
        // confirm is a js method used to ask the user for  confirmation. its shows to button.
        confirm("are you sure");

        name = prompt("enter your name");
        document.write("my name is:-" + name);


    </script>


</body>

</html>
