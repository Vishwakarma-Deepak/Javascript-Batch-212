<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        // example of Arithmetic operator.
        let a = 2;
        let b = 4;
        let c = a + b;
        console.log(c);
        console.log(b - a);
        console.log(b * a);
        console.log(b / a);
        // reminder 
        console.log(b % a);
        console.log(a ** 4);


        // Assignment operator 
        let d = 5;
        d += 5;
        console.log(d);

        // comparison operator 
        z = 5;
        y = 7;
        console.log(z > y);
        console.log(y <= z);
        console.log(z >= y);
        console.log(z < y);
        console.log(z != y);

        // strict not equal-
        console.log(3 !== 3);
        console.log(3 !== "3");



        console.log(z == y);

        //  its check value not  datatype  .
        console.log(3 == "3");

        // but its check value and datatype also.
        console.log(3 === "3");

        // logical operators 
        // and operator if both conditions are true or false  then also true otherwise false 
        let m = 22;
        let n = 6;
        console.log(m > n && m > 22);

        // or operator 
        // if one is true then it will print true 
        console.log(m > n || m > 22);

        // not
        console.log(!(m > n));


    </script>

</body>

</html>
