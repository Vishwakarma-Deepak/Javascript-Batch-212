<!DOCTYPE html>

</head>
<body>
<!-- non primitive it is used to store multiple key value pairs . -->
    <script>
        // object-represents the key value pairs. 
        let college={
            name:"deepak",
            age:22,
            city:"mumbai",
        }
        console.log(college);
        console.log(college.name);
        console.log(college.age);

        // arrays - represents ordered lists .
        let name =["alam","deepak","shiva",34,35,36,true];
        console.log(name);
        console.log(name[0]);

        

    </script>
    
</body>
</html>
