<body>
    <script>
        // check a no.is odd or even.
        function evenodd(a) {
            if (a % 2 == 0) {
                console.log("it is even no.", a);
            }
            else {
                console.log("it is odd no.", a);
            }
        }
        evenodd(7);
    </script>
